
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مردوال سون ویلی</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Nastaliq Urdu', serif;
  background: #f2f5f8;
  color: #17344b;
  padding-bottom: 85px;
}

/* چھوٹا ہیڈر */
.header {
  height: 245px;
  overflow: hidden;
  position: relative;
  text-align: center;
  color: white;
  padding: 15px 10px;
  background:
    linear-gradient(180deg, #168fc4 0%, #7bc5db 48%, #d7e9c5 49%, #438b55 100%);
  border-radius: 0 0 28px 28px;
}

.header:before {
  content: "🏔️";
  position: absolute;
  font-size: 115px;
  bottom: 35px;
  right: 0;
  opacity: .65;
}

.header:after {
  content: "🏞️";
  position: absolute;
  font-size: 105px;
  bottom: 28px;
  left: 0;
  opacity: .8;
}

.brand {
  position: relative;
  z-index: 2;
}

.logo {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: white;
  border: 3px solid #f5d46b;
  margin: 0 auto 4px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #147b50;
  font-size: 27px;
  font-weight: bold;
}

.brand h1 {
  font-size: 25px;
  line-height: 1.8;
  text-shadow: 1px 2px 4px #234;
}

.brand p {
  font-size: 13px;
  direction: ltr;
}

.slogan {
  position: relative;
  z-index: 2;
  margin-top: 4px;
  color: #eaffd8;
  font-size: 15px;
  font-weight: bold;
}

/* سرچ */
.search-area {
  position: relative;
  z-index: 3;
  display: flex;
  gap: 7px;
  margin: 13px auto 0;
  max-width: 420px;
}

.search-area input {
  flex: 1;
  min-width: 0;
  padding: 9px 12px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.search-area button {
  border: none;
  border-radius: 10px;
  padding: 5px 13px;
  background: #075c91;
  color: white;
  font-family: inherit;
}

/* کیٹیگریز */
.section-title {
  text-align: center;
  margin: 18px 0 12px;
  font-size: 19px;
  color: #075c91;
}

.categories {
  padding: 0 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.card {
  min-height: 105px;
  border-radius: 15px;
  background: white;
  box-shadow: 0 3px 10px #00000012;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  text-align: center;
  padding: 9px 3px;
  border-bottom: 3px solid #2495a5;
  transition: .2s;
}

.card:active {
  transform: scale(.96);
}

.card .emoji {
  font-size: 29px;
}

.card span:last-child {
  font-size: 12px;
  font-weight: 600;
}

.card:nth-child(3n+1) { border-color: #159b68; }
.card:nth-child(3n+2) { border-color: #e4a12b; }
.card:nth-child(3n+3) { border-color: #488bd5; }

.no-result {
  display: none;
  text-align: center;
  padding: 20px;
  color: #777;
}

/* نیچے مینیو */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 69px;
  background: #075b91;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 10;
  box-shadow: 0 -3px 12px #0002;
}

.nav-item {
  color: white;
  text-align: center;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  border: none;
  background: none;
}

.nav-item .emoji {
  display: block;
  font-size: 22px;
  margin-bottom: 1px;
}

.nav-item.active {
  color: #ffe17b;
}

@media (max-width: 360px) {
  .categories { gap: 8px; padding: 0 8px; }
  .card { min-height: 95px; }
  .brand h1 { font-size: 22px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="logo">م</div>
    <h1>مردوال سون ویلی</h1>
    <p>MARDWAL SOON VALLEY</p>
    <div class="slogan">ہماری وادی — ہماری پہچان</div>
  </div>

  <div class="search-area">
    <input type="search" id="search"
    placeholder="اپنی پسند کی چیز تلاش کریں...">
    <button onclick="searchCards()">تلاش</button>
  </div>
</header>

<h2 class="section-title">ہماری وادی کی خدمات</h2>

<main class="categories" id="categories">

  <div class="card"><span class="emoji">📰</span><span>تازہ خبریں</span></div>
  <div class="card"><span class="emoji">🕌</span><span>اسلامی معلومات</span></div>
  <div class="card"><span class="emoji">🏨</span><span>ہوٹل اور رہائش</span></div>

  <div class="card"><span class="emoji">🏞️</span><span>سیاحتی مقامات</span></div>
  <div class="card"><span class="emoji">🛍️</span><span>خریداری</span></div>
  <div class="card"><span class="emoji">⚽</span><span>کھیل</span></div>

  <div class="card"><span class="emoji">📺</span><span>لائیو نشریات</span></div>
  <div class="card"><span class="emoji">🚑</span><span>ایمرجنسی</span></div>
  <div class="card"><span class="emoji">👥</span><span>اہلِ علاقہ</span></div>

  <div class="card"><span class="emoji">🎉</span><span>تقریبات</span></div>
  <div class="card"><span class="emoji">🌾</span><span>زراعت</span></div>
  <div class="card"><span class="emoji">🌤️</span><span>موسم</span></div>

  <div class="card"><span class="emoji">🏪</span><span>بازار</span></div>
  <div class="card"><span class="emoji">📇</span><span>کاروباری ڈائریکٹری</span></div>
  <div class="card"><span class="emoji">📍</span><span>علاقے کی معلومات</span></div>

</main>

<div class="no-result" id="noResult">
  مطلوبہ معلومات نہیں ملیں۔
</div>

<nav class="bottom-nav">
  <button class="nav-item active"><span class="emoji">🏠</span>ہوم</button>
  <button class="nav-item"><span class="emoji">🔍</span>تلاش</button>
  <button class="nav-item"><span class="emoji">📡</span>لائیو</button>
  <button class="nav-item"><span class="emoji">👤</span>پروفائل</button>
  <button class="nav-item"><span class="emoji">☰</span>مزید</button>
</nav>

<script>
function searchCards() {
  const value = document.getElementById("search").value.trim();
  const cards = document.querySelectorAll(".card");
  let found = 0;

  cards.forEach(card => {
    const match = card.innerText.includes(value);
    card.style.display = match ? "flex" : "none";
    if (match) found++;
  });

  document.getElementById("noResult").style.display =
    found ? "none" : "block";
}

document.getElementById("search").addEventListener("input", searchCards);

document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(btn =>
      btn.classList.remove("active")
    );
    item.classList.add("active");
  });
});
</script>

</body>
</html>
